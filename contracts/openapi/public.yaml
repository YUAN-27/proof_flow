openapi: 3.1.0
info:
  title: ProofFlow Business API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      operationId: getBusinessHealth
      summary: Check whether the business API is responding
      responses:
        '200':
          description: Business API is serving requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, status]
                properties:
                  service:
                    const: business-api
                  status:
                    const: ok
  /api/v1/cases:
    post:
      operationId: createCase
      summary: Create a case with status OPEN and version 1
      security:
        - caseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  pattern: '.*\S.*'
                  description: Nonblank case title
      responses:
        '201':
          description: Case created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          description: Invalid JSON or missing or invalid title
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
  /api/v1/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getCase
      summary: Read a case in the authenticated tenant
      security:
        - caseBearer: []
      responses:
        '200':
          $ref: '#/components/responses/CaseFound'
        '400':
          description: Invalid case identifier
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
        '404':
          $ref: '#/components/responses/CaseNotFound'
  /api/v1/cases/{caseId}/status:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    patch:
      operationId: updateCaseStatus
      summary: Update the status using the current version
      security:
        - caseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, status]
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                status:
                  $ref: '#/components/schemas/CaseStatus'
      responses:
        '200':
          $ref: '#/components/responses/CaseFound'
        '400':
          description: Invalid case identifier, JSON, version, or status
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '409':
          description: Stale version or invalid status transition
          content:
            application/problem+json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [VERSION_CONFLICT, INVALID_STATUS_TRANSITION]
  /api/v1/cases/{caseId}/evidence:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: listCaseEvidence
      summary: List evidence metadata for a case
      security:
        - caseBearer: []
      responses:
        '200':
          description: Evidence metadata in upload order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CaseEvidence'
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '503':
          description: Evidence metadata storage is unavailable
    post:
      operationId: uploadCaseEvidence
      summary: Upload one PDF, PNG or JPEG up to 10 MiB
      security:
        - caseBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Evidence stored with its download path in the Location header
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEvidence'
        '400':
          description: Missing file, empty file, or invalid filename or case identifier
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '413':
          description: File or multipart request exceeds the upload limit
        '415':
          description: Unsupported request media type or file signature
        '503':
          description: Evidence storage is unavailable or at capacity
  /api/v1/cases/{caseId}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadCaseEvidence
      summary: Download the original file as an attachment
      security:
        - caseBearer: []
      responses:
        '200':
          description: Original evidence bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/CaseUnauthorized'
        '404':
          description: The case or attachment does not exist in the authenticated tenant
        '503':
          description: Evidence metadata or file storage is unavailable
components:
  securitySchemes:
    caseBearer:
      type: http
      scheme: bearer
      description: Opt-in local integration credential configured on the server
  parameters:
    CaseId:
      in: path
      name: caseId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CaseFound:
      description: Case snapshot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Case'
    CaseUnauthorized:
      description: Missing or invalid bearer credential, or the local API is disabled
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
    CaseNotFound:
      description: Case does not exist in the authenticated tenant
  schemas:
    CaseEvidence:
      type: object
      required: [id, caseId, filename, contentType, sizeBytes, uploadedAt, uploadedBy]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        filename:
          type: string
        contentType:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          type: string
    CaseStatus:
      type: string
      enum: [OPEN, IN_REVIEW, CLOSED]
    Case:
      type: object
      required: [id, title, status, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/CaseStatus'
        version:
          type: integer
          format: int64
          minimum: 1
