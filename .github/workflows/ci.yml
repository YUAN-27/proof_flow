name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check: checks(linux)
          - os: macos-15
            check: checks (macOS)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.8'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm --prefix apps/frontend ci --no-audit --no-fund
      - name: Run module tests and frontend checks
        run: make test

      - name: Validate Compose configuration
        id: compose
        if: runner.os == 'Linux'
        run: |
          cp .env.example .env
          node -e 'const token = require("node:crypto").randomBytes(32).toString("hex"); require("node:fs").appendFileSync(".env", `\nPROOFFLOW_CASES_TOKEN=${token}\nPROOFFLOW_CASES_TENANT_ID=ci-tenant\nPROOFFLOW_CASES_ACTOR_ID=ci-operator\n`);'
          make config

      - name: Build and start the stack
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: make up

      - name: Run Compose smoke tests
        if: runner.os == 'Linux'
        run: |
          node --env-file=.env -e 'const result = require("node:child_process").spawnSync("make", ["test-integration", "test-case-integration"], { stdio: "inherit" }); process.exitCode = result.status ?? 1;'

      - name: Print Compose logs on failure
        if: failure() && steps.compose.outcome == 'success'
        run: docker compose logs --no-color

      - name: Clean up the CI stack
        if: always() && steps.compose.outcome == 'success'
        run: docker compose down --volumes

      - name: Verify attachment persistence after restart
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: make test-evidence-integration
