name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Java unit tests
        run: make test-java

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Agent test dependencies
        run: python -m pip install -r agent-service/requirements-dev.txt
      - name: Run Agent unit tests
        run: make test-agent

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Lint and build frontend
        run: make check-frontend

      - name: Validate Compose configuration
        run: cp .env.example .env && make config
